services:

  # =========================
  # BidLens Backend
  # =========================
  - type: web
    name: bidlens-backend
    runtime: docker
    plan: free

    dockerfilePath: ./backend/Dockerfile

    healthCheckPath: /api/health

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest

      - key: GEMINI_MODEL
        value: gemini-3.5-flash

      - key: MAX_OUTPUT_TOKENS
        value: "65536"

      - key: TOP_P
        value: "0.95"

      - key: THINKING_LEVEL
        value: medium

      - key: AI_RETRIES
        value: "2"

      - key: AI_RETRY_DELAY_SECONDS
        value: "0.5"

      - key: AI_MAX_WORKERS
        value: "8"

      - key: AI_KEY_WAIT_SECONDS
        value: "60"

      - key: LOG_LEVEL
        value: INFO

      - key: DB_PATH
        value: /tmp/bidlens.db

      - key: BIDLENS_USERNAME
        value: admin

      - key: BIDLENS_PASSWORD
        sync: false

      - key: AUTH_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        fromService:
          type: web
          name: bidlens-frontend
          property: host

  # =========================
  # BidLens Frontend
  # =========================
  - type: static
    name: bidlens-frontend

    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bidlens-backend
          property: host