services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      no_cache: true
      pull: true
    pull_policy: build
    container_name: bidlens-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_PATH=/app/database/bidlens.db
      - PYTHONPATH=/app
      - PORT=8000
      - BIDLENS_USERNAME=admin
      - BIDLENS_PASSWORD=productspace
      - AUTH_SECRET=local-bidlens-dev-secret-change-me
    volumes:
      - ./database:/app/database
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - bidlens-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      no_cache: true
      pull: true
    pull_policy: build
    container_name: bidlens-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - bidlens-network

networks:
  bidlens-network:
    driver: bridge